name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

jobs:
  linux-musl:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-musleabi
          - arm-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
      - run: cross build --release --target ${{ matrix.target }}
      - run: build/pack.sh ${{ matrix.target }} target/${{ matrix.target }}/release/srun dist ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*
            !dist/SIZES.txt

  mips-musl:
    name: ${{ matrix.target }} (nightly, best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # 32-bit targets are soft-float o32 in rustc, matching the cross images.
          - { target: mipsel-unknown-linux-musl, features: "+crt-static" }
          - { target: mips-unknown-linux-musl, features: "+crt-static" }
          # 64-bit rustc targets are hard-float but the cross images ship a
          # soft-float musl; +soft-float aligns them (unstable, nightly only).
          - { target: mips64el-unknown-linux-muslabi64, features: "+crt-static,+soft-float" }
          - { target: mips64-unknown-linux-muslabi64, features: "+crt-static,+soft-float" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: taiki-e/install-action@cross
      # Tier 3: no rust-std, no self-contained crt/libunwind. Cross.toml
      # pre-build aliases libgcc_eh as libunwind inside the image.
      - run: cross +nightly build --release --target ${{ matrix.target }} -Z build-std=std,panic_abort
        env:
          RUSTFLAGS: -C target-feature=${{ matrix.features }} -C link-self-contained=no
      - run: build/pack.sh ${{ matrix.target }} target/${{ matrix.target }}/release/srun dist ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*
            !dist/SIZES.txt

  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: i686-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/srun
          [[ "${{ runner.os }}" == "Windows" ]] && bin="$bin.exe"
          build/pack.sh ${{ matrix.target }} "$bin" dist ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*
            !dist/SIZES.txt

  publish:
    # mips-musl is continue-on-error, so a failed MIPS build still lets
    # publish run; whatever MIPS artifacts succeeded are included.
    needs: [linux-musl, mips-musl, native]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
