[package]
name = "srun"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Minimal cross-platform client for the Srun campus network portal"
readme = "README.md"
build = "build.rs"

[[bin]]
name = "srun"
path = "src/main.rs"

[lib]
name = "srun"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"
if-addrs = "0.15"
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[features]
default = []
tls = ["dep:rustls", "dep:webpki-roots"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
